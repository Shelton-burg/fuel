name: keep-alive

# Render spins a free web service down after 15 minutes without traffic, then takes ~1 minute
# to wake — which makes the phone app feel broken.
#
# A frequent cron does NOT work for this: GitHub delays (and sometimes drops) high-frequency
# scheduled runs, so a 5-minute schedule let the app sleep. Instead each run of this job holds
# the service warm itself, pinging every 5 minutes for ~5h50m. That means only ONE trigger per
# 6 hours has to fire — and if one is late, the service sleeps briefly and the next ping wakes
# it, with the gap still under Render's 15-minute window in normal conditions.
#
# Free for public repos, no third-party account, no secrets. GitHub disables scheduled
# workflows after 60 days without commits.

on:
  schedule:
    - cron: '5 */6 * * *' # 00:05 · 06:05 · 12:05 · 18:05 UTC
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions: {}

jobs:
  keep-warm:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # just under GitHub's 6-hour job cap
    steps:
      - name: Hold FUEL warm
        run: |
          URL="https://fuel-c6if.onrender.com/api/health"
          DEADLINE=$(( $(date +%s) + 5*3600 + 50*60 ))   # 5h50m
          FAILS=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            START=$(date +%s)
            CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 120 "$URL" || echo 000)
            TOOK=$(( $(date +%s) - START ))
            echo "$(date -u +%H:%M:%S)Z  HTTP $CODE in ${TOOK}s"
            if [ "$CODE" = "200" ]; then
              FAILS=0
            else
              FAILS=$((FAILS + 1))
              echo "::warning::health returned $CODE ($FAILS in a row)"
              if [ "$FAILS" -ge 3 ]; then echo "::error::FUEL has been unreachable three times"; exit 1; fi
            fi
            sleep 300
          done
          echo "Handing over to the next scheduled run."
